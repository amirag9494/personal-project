<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioscape | Midnight Reading Room</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Biblioscape</h1>
            <p>Your Personal Digital Bookshelf & Lo-Fi Study Room</p>
        </header>

        <main class="dashboard">
            <section class="card">
                <h2>📚 My Bookshelf</h2>
                <form id="book-form">
                    <input type="text" id="title" placeholder="Book Title" required>
                    <input type="text" id="author" placeholder="Author" required>
                    <input type="text" id="genre" placeholder="Genre" required>
                    <textarea id="notes" placeholder="Short Notes / Quotes"></textarea>
                    <button type="submit">Add to Bookshelf</button>
                </form>
                <div id="books-container" class="books-list">
                </div>
            </section>

            <section class="card">
                <h2>🎧 Lo-Fi Atmosphere</h2>
                <div class="spotify-player-container" style="margin-top: 1rem;">
                    <iframe style="border-radius:12px" src="https://open.spotify.com/embed/playlist/4RMz5ZxvcNcf5YQvv27KXJ?utm_source=generator&theme=0" width="100%" height="352" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
                </div>
            </section>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
